# A French translation written against code-level keys only, plus one refined key.
#
# raoh.out_of_range names both bounds, so a min-only constraint cannot fill it and
# resolution must continue into the base bundle rather than give up.
raoh.invalid_format=format invalide
raoh.invalid_format.uuid=UUID invalide
raoh.out_of_range=entre {min} et {max}
