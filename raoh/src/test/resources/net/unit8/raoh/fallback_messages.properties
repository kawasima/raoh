# Bundle for ResourceBundleMessageResolver fallback tests.
#
# raoh.out_of_range.minimum names both bounds, so it cannot be filled from a min-only
# constraint. Resolution must skip it and try raoh.out_of_range rather than give up.
raoh.out_of_range.minimum=between {min} and {max}
raoh.out_of_range=outside the allowed range

# Braces around prose are literal text, not a placeholder no metadata can supply.
raoh.invalid_format=expected an object like {"id": 1}
