name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      # The API diff is a detector, so the build must fail when it did not run — a plugin
      # declaration dropped from a module POM would otherwise leave `verify` green, the job
      # summary empty and nobody any the wiser, which is the silence this check exists to
      # end. The module list is spelled out here on purpose rather than derived from the
      # POMs: derived, it would shrink along with the declaration it is meant to catch.
      # Reporting the result is a separate step below, and is allowed to fail on its own.
      - name: Verify API diff reports
        if: success()
        run: |
          status=0
          for report in raoh/target/japicmp/api-diff.md \
                        raoh-json/target/japicmp/api-diff.md \
                        raoh-jooq/target/japicmp/api-diff.md; do
            if [ ! -s "$report" ]; then
              echo "::error::No API diff report at $report — is the japicmp plugin still declared in that module's POM?"
              status=1
            fi
          done
          exit $status
      # JaCoCo (configured in the parent pom) writes per-module reports under
      # target/site/jacoco during `verify`. Surface them as a job-summary table and
      # a downloadable HTML artifact. Reporting only — no coverage thresholds.
      - name: Coverage summary
        if: always()
        # Reporting only: never let a summary-parsing hiccup red an otherwise-green build.
        continue-on-error: true
        run: |
          {
            echo "## Coverage (line)"
            echo "| Module | Covered/Total | % |"
            echo "|---|---|---|"
            for f in $(find . -path '*/target/site/jacoco/jacoco.xml' | sort); do
              mod=$(echo "$f" | sed -E 's#\./([^/]+)/target.*#\1#')
              c=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$f" | tail -1)
              missed=$(echo "$c" | sed -E 's/.*missed="([0-9]*)".*/\1/')
              covered=$(echo "$c" | sed -E 's/.*covered="([0-9]*)".*/\1/')
              total=$((missed + covered))
              pct=$(awk "BEGIN{ if ($total>0) printf \"%.1f\", 100*$covered/$total; else print \"n/a\" }")
              echo "| $mod | $covered/$total | ${pct}% |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
      # japicmp (configured in the parent pom) diffs the published API of raoh, raoh-json
      # and raoh-jooq against the last release during `verify`, writing a report under
      # target/japicmp. Show it here so a change to the API surface is visible on the PR
      # that makes it. Reporting only — before 1.0 the build does not fail on a break; see
      # the plugin's comment in the parent pom.
      - name: Public API diff
        if: always()
        # Reporting only: never let a summary-formatting hiccup red an otherwise-green build.
        continue-on-error: true
        run: |
          baseline=$(sed -n 's#.*<japicmp.baseline>\(.*\)</japicmp.baseline>.*#\1#p' pom.xml)
          {
            echo "## Public API diff (baseline ${baseline})"
            for f in $(find . -path '*/target/japicmp/api-diff.md' | sort); do
              mod=$(echo "$f" | sed -E 's#\./([^/]+)/target.*#\1#')
              size=$(wc -c < "$f")
              echo "### $mod"
              # The job summary caps at 1 MiB. A report that big belongs in the artifact.
              if [ "$size" -le 262144 ]; then
                # Drop the report's own H1 and demote its headings two levels, so its
                # sections nest under the module heading instead of outranking it.
                sed -e '/^# Compatibility Report$/d' -e 's/^#/###/' "$f"
              else
                echo "Report is ${size} bytes — see the japicmp-api-diff artifact."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API diff reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japicmp-api-diff
          path: '**/target/japicmp/'
          if-no-files-found: warn

  nullcheck:
    name: NullAway null-analysis gate (JDK 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The @NullMarked modules (raoh, raoh-json, raoh-jooq) declare a `nullcheck`
      # profile that runs NullAway via Error Prone. It requires exactly JDK 25.
      - name: NullAway check
        run: mvn -B --no-transfer-progress -Pnullcheck compile

  conformance:
    name: Raoh Specification conformance (JDK 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The suite and the verifier both come from the revision conformance/spec.lock pins, never
      # from a branch: a check that passed on a commit must pass on it again.
      - name: Read the pinned specification
        id: spec
        run: |
          echo "repository=$(jq -er .repository conformance/spec.lock)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision conformance/spec.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the specification
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.spec.outputs.repository }}
          ref: ${{ steps.spec.outputs.revision }}
          path: raoh-specification
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: raoh-specification/go.mod
      # Exits non-zero when a profile is non-conformant, which includes a stale divergence in
      # conformance/conformance.json, and when raoh-verify cannot trust its input.
      - name: Run the suite and verify
        run: RAOH_SPECIFICATION_DIR=raoh-specification scripts/conformance.sh
      # The report is what supports a statement of conformance, so a run that wrote none has
      # checked nothing, whatever its exit status.
      - name: Verify the conformance report
        if: success()
        run: |
          if [ ! -s conformance/target/conformance-report.json ]; then
            echo "::error::raoh-verify wrote no conformance report"
            exit 1
          fi
      - name: Conformance summary
        if: always()
        # Reporting only: never let a summary-formatting hiccup red an otherwise-green build.
        continue-on-error: true
        run: |
          report=conformance/target/conformance-report.json
          [ -s "$report" ] || exit 0
          {
            echo "## Raoh Specification $(jq -r .specification.version "$report") conformance"
            echo "| Profile | Status | Matched | Divergent | Unsupported | Failed |"
            echo "|---|---|---|---|---|---|"
            jq -r '.profiles | to_entries[] | "| \(.key) | \(.value.status) | \(.value.matched) | \(.value.divergent) | \(.value.unsupported) | \(.value.failed) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the runner result and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raoh-specification-conformance
          path: |
            conformance/target/runner-result.json
            conformance/target/conformance-report.json
          if-no-files-found: warn

  examples:
    name: Build examples (JDK 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The examples live outside the reactor and depend on the current -SNAPSHOT,
      # so install the modules they use (raoh + raoh-json, and their parent) to the
      # local repo first, then build each example.
      - name: Install required modules to local repo
        run: mvn -B --no-transfer-progress -pl raoh,raoh-json -am install -DskipTests
      - name: Build examples
        run: |
          mvn -B --no-transfer-progress -f examples/spring/pom.xml verify
          mvn -B --no-transfer-progress -f examples/schema-versioning/pom.xml verify
